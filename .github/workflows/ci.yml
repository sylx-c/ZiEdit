# CI（H-4 正式感外壳）：三平台前端 + Rust 全量门禁。
# master push 与全部 PR 均执行检查及三平台安装包构建。
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  frontend:
    name: 前端（tsc + vitest）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # (2026-10-29 ac-011) pdfjs-dist 6.4 engines 要求 Node >=22.13 或 >=24。
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node --test scripts/build-provenance.test.mjs scripts/release-acceptance.test.mjs scripts/gate-state.test.mjs scripts/publish-release.test.mjs

  rust:
    name: Rust（test + clippy -D warnings + fmt）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: 安装 Linux 系统依赖（tauri 构建）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  licenses:
    name: 版权来源与许可（固定证据及严格门禁）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - run: node scripts/sync-pdfjs-assets.mjs
      - run: npm run license:check

  # 批6 工程化收口 B2：依赖安全审计（npm + cargo），独立 job 并行，不阻塞 build。
  # 口径：真实漏洞不硬压（无 continue-on-error / ignore）；已知待修项见 docs/changes/eng-batch6-closeout.md。
  audit:
    name: 安全审计（npm audit + cargo audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # npm audit 只读 package-lock.json，无需 npm ci；runner 默认官方 registry，audit 端点可用。
      # audit-level=high：high 及以上失败。低级别漏报名义上放行，避免离线桌面应用长期被 low/moderate 打红。
      # 已知状态：markdown-it 15.0.0–15.0.2 存在 1 条 high（GHSA-gfr2-rv44-r23c），修复版 15.0.3，
      # 升级运行时依赖归 Lead 处理，此前本步骤如实失败。
      - name: npm audit（生产与开发依赖，high 及以上失败）
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      # cargo audit 选 cargo install --locked 而非 rustsec/audit-check@v2.0.0：后者镜像内 cargo-audit
      # 版本固定偏旧，对本仓库 Cargo.lock version 4 的解析兼容存疑，且 fork PR 上 Checks API 会失败；
      # cargo install 每次取最新发布版，仅多数分钟编译（单 ubuntu job）。代价与理由详见收口卡。
      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked
      # 默认口径：存在漏洞（vulnerability advisory）即失败；unmaintained 等告警不失败（Tauri 生态
      # unmaintained crate 噪声大，清零不属于本批范围）。
      - name: cargo audit（src-tauri/Cargo.lock）
        run: cargo audit --file src-tauri/Cargo.lock

  build:
    name: tauri build（三平台安装包）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [frontend, rust, licenses]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 系统依赖（tauri 构建）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 渠道（001 规则 30）：CI 产物是正式包，必须显式置 release，否则关于对话框显示「开发版」
      - run: node scripts/gen-rust-notices.mjs --check
      - run: node scripts/build-verified.mjs --ci-validated
        env:
          ZIEDIT_CHANNEL: release
          # 选项B（2026-11-12 批准）：7-Zip NSIS 解析缺陷过渡期，Windows 候选解包核验走静默安装回退。
          # 见 scripts/verify-installer-licenses.mjs 文件头与 docs/tmp/phase-a/optionB-decision-memo.md；上游修复后移除。
          ZIEDIT_INSTALLER_VERIFY_FALLBACK: ${{ runner.os == 'Windows' && '1' || '0' }}
      - uses: actions/upload-artifact@v7
        with:
          name: ziedit-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            docs/tmp/phase1/build-manifest.json
          if-no-files-found: error
  candidate:
    name: 草稿 Release（候选包）
    runs-on: ubuntu-latest
    needs: [build]
    # v* 标签：只创建一个草稿 Release 并集中上传三平台产物。
    # 发布步骤不再放进构建矩阵——修前三平台各自 create，竞态产生过同 tag 的多个空草稿。
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建/复用草稿 Release 并上传候选包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "Release $tag 已公开发布，禁止覆盖资产" >&2
            exit 1
          fi
          if [ "$state" = "missing" ]; then
            gh release create "$tag" --draft --generate-notes
          fi
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | xargs -0 gh release upload "$tag" --clobber
          manifest=$(find artifacts -path '*ziedit-windows-latest*' -name 'build-manifest.json' | head -1)
          if [ -n "$manifest" ]; then
            cp "$manifest" build-manifest.json
            gh release upload "$tag" build-manifest.json --clobber
          fi
